<body style="margin:0;">
<div style="background-color:transparent;box-sizing:border-box;">
  <div style="font-family:'Fredoka',sans-serif;background:linear-gradient(135deg,#fdf9fb 0%,#eef7fb 100%);color:#0f172a;padding:24px 12px;box-sizing:border-box;">

        <p style="color:#64748b;margin:4px 0 0;font-size:10px;">Âm thanh · Combo · Thành tựu · Nhiệm vụ · Top toàn cầu</p>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid rgba(15,23,42,.08);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.04);flex-wrap:wrap;gap:4px;">
        <span style="color:#64748b;">Cấp <strong id="levelText" style="color:#0891b2;">1</strong>/5000</span>
        <span style="color:#64748b;">Điểm <strong id="scoreText" style="color:#bd3193;">0</strong></span>
        <span style="color:#64748b;">Mạng <strong id="livesText" style="color:#dc2626;">♥♥♥♥♥</strong></span>
        <span style="color:#64748b;">Hạng <strong id="rankText" style="color:#f59e0b;">1</strong></span>
        <span id="comboText" style="color:#ea580c;font-weight:700;display:none;">Combo ×0</span>

      </div>

      <div id="message" style="text-align:center;margin-top:10px;min-height:20px;font-size:12px;font-weight:600;color:#0891b2;line-height:1.4;"></div>
    </div>
  </div>
</div>
<script>
(function(){
  var TOTAL=5000, MAXLIVES=10, STARTLIVES=5;
  var st={level:0,score:0,lives:STARTLIVES,timer:null,winTimer:null,loseTimer:null,over:false,paused:false,playing:false,combo:0,maxCombo:0,noMiss:0,bestNoMiss:0,muted:false,resolved:false,giftLevel:-1,wrong:[],wby:{},boss:null,bossDone:-1,curType:'',lastQ:'',mode:'normal',pt:null,ptKey:'',spInt:null,spEnd:0};
  var area=document.getElementById('gameArea'),msg=document.getElementById('message');
  var lt=document.getElementById('levelText'),st2=document.getElementById('scoreText'),lv=document.getElementById('livesText'),rk=document.getElementById('rankText'),cb=document.getElementById('comboText');
  var controls=document.getElementById('controls');
  var pauseBtn=document.getElementById('pauseBtn'),skipBtn=document.getElementById('skipBtn'),muteBtn=document.getElementById('muteBtn'),restartBtn=document.getElementById('restartBtn'),homeBtn=document.getElementById('homeBtn');

  var _MR=Math.random.bind(Math),rs=(_MR()*4294967296)>>>0;
  function RND(){rs=(rs+0x6D2B79F5)|0;var t=Math.imul(rs^(rs>>>15),1|rs);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}
  function hsh(a,b){var h=Math.imul(a^0x9E3779B9,2654435761)^Math.imul((b|0)+0x7F4A7C15,40503);h^=h>>>15;h=Math.imul(h,2246822519);h^=h>>>13;return h>>>0;}
  function strSeed(x){var h=2166136261;for(var i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function ri(a,b){return Math.floor(RND()*(b-a+1))+a;}
  function pk(a){return a[Math.floor(RND()*a.length)];}
  function sh(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(RND()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
  function df(){return Math.min(1,st.level/1500);}
  function rankOf(level){if(level>=TOTAL)return 'VƯỢT 5000';return Math.floor(level/100)+1;}

  // ===== ÂM THANH (Web Audio API) =====
  var AC=null;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
  function tone(freq,dur,type,vol,delay){if(st.muted)return;var c=ac();if(!c)return;try{var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(vol||0.12,c.currentTime+(delay||0));g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(delay||0)+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+(delay||0));o.stop(c.currentTime+(delay||0)+dur);}catch(e){}}
  function sClick(){tone(600,0.05,'square',0.06);}
  function sWin(){tone(523,0.1,'sine',0.1);tone(659,0.1,'sine',0.1,0.08);tone(784,0.15,'sine',0.1,0.16);}
  function sLose(){tone(300,0.15,'sawtooth',0.08);tone(200,0.25,'sawtooth',0.08,0.12);}
  function sLevelUp(){tone(523,0.1,'triangle',0.1);tone(659,0.1,'triangle',0.1,0.1);tone(784,0.1,'triangle',0.1,0.2);tone(1047,0.25,'triangle',0.1,0.3);}
  function sGameOver(){tone(400,0.2,'sawtooth',0.08);tone(300,0.2,'sawtooth',0.08,0.18);tone(200,0.4,'sawtooth',0.08,0.36);}
  function sAch(){tone(880,0.08,'sine',0.1);tone(1175,0.08,'sine',0.1,0.08);tone(1568,0.15,'sine',0.1,0.16);}
  muteBtn.onclick=function(){st.muted=!st.muted;muteBtn.textContent='Âm thanh: '+(st.muted?'TẮT':'BẬT');if(!st.muted)sClick();};

  function upd(){updItems();lt.textContent=Math.min(st.level+1,TOTAL);st2.textContent=st.score;var h='';for(var i=0;i<MAXLIVES;i++)h+=(i<st.lives)?'♥':'♡';lv.textContent=h;rk.textContent=rankOf(st.level);
    if(st.combo>=2){cb.style.display='inline';cb.textContent='Combo ×'+st.combo+(st.combo>=5?' 🔥':'');}else{cb.style.display='none';}}
  function sm(t,c){msg.textContent=t||'';msg.style.color=c||'#0891b2';}
  function clr(){if(st.timer){clearTimeout(st.timer);clearInterval(st.timer);st.timer=null;}
    if(st.winTimer){clearTimeout(st.winTimer);st.winTimer=null;}
    if(st.loseTimer){clearTimeout(st.loseTimer);st.loseTimer=null;}}
  function dis(){Array.prototype.forEach.call(area.querySelectorAll('button'),function(b){b.disabled=true;});}
  function showControls(){controls.style.display='flex';}
  function hideControls(){controls.style.display='none';}

  // ===== CONFETTI =====
  function confetti(){var colors=['#bd3193','#0891b2','#f59e0b','#059669','#dc2626','#7c3aed'];
    for(var i=0;i<36;i++){(function(){var p=document.createElement('div');var c=pk(colors);
      p.style.cssText='position:absolute;left:'+(RND()*96+2)+'%;top:-12px;width:7px;height:11px;background:'+c+';border-radius:2px;z-index:20;transition:transform 1.8s ease-in,opacity 1.8s ease;opacity:1;pointer-events:none;';
      area.appendChild(p);setTimeout(function(){p.style.transform='translateY(340px) rotate('+(RND()*720-360)+'deg)';p.style.opacity='0';},20);
      setTimeout(function(){p.remove();},1900);})();}}

  // ===== THÀNH TỰU (12 huy chương) =====
  var ACH_KEY='voly_ach_v1';
  function getAch(){try{return JSON.parse(localStorage.getItem(ACH_KEY)||'[]');}catch(e){return[];}}
  function saveAch(arr){try{localStorage.setItem(ACH_KEY,JSON.stringify(arr));}catch(e){}}
  var ACHS=[
    {id:'first',ic:'★',name:'Bước đầu',desc:'Qua cấp đầu tiên'},{id:'lvl10',ic:'▲',name:'Mười cấp',desc:'Đến cấp 10'},
    {id:'lvl50',ic:'◆',name:'Nửa trăm',desc:'Đến cấp 50'},{id:'lvl100',ic:'●',name:'Trăm cấp',desc:'Đến cấp 100'},
    {id:'sc100',ic:'✦',name:'Trăm điểm',desc:'Đạt 100 điểm'},{id:'sc500',ic:'✧',name:'500 điểm',desc:'Đạt 500 điểm'},
    {id:'cb5',ic:'5',name:'Combo 5',desc:'Combo ×5 liên tiếp'},{id:'cb10',ic:'X',name:'Combo 10',desc:'Combo ×10 liên tiếp'},
    {id:'nm10',ic:'✓',name:'Bất bại 10',desc:'Qua 10 cấp không mất mạng'},{id:'gm5',ic:'♠',name:'Game thủ',desc:'Chơi 5 lần'},
    {id:'rk5',ic:'♛',name:'Hạng 5',desc:'Đạt hạng 5 (cấp 401+)'},{id:'win',ic:'♚',name:'Vô địch',desc:'Vượt 5000 cấp'}
  ];
  function checkAch(){var unlocked=getAch();var newOnes=[];
    function chk(id,cond){if(cond&&unlocked.indexOf(id)===-1){unlocked.push(id);newOnes.push(id);}}
    chk('first',st.level>=1);chk('lvl10',st.level>=9);chk('lvl50',st.level>=49);chk('lvl100',st.level>=99);
    chk('sc100',st.score>=100);chk('sc500',st.score>=500);chk('cb5',st.maxCombo>=5);chk('cb10',st.maxCombo>=10);
    chk('nm10',st.bestNoMiss>=10);chk('gm5',stats.gamesPlayed>=5);chk('rk5',st.level>=400);chk('win',st.level>=5000);(ACHX||[]).forEach(function(a){chk(a[0],AM[a[4]]()>=a[5]);});
    if(newOnes.length){saveAch(unlocked);sAch();newOnes.forEach(function(id,idx){var a=ACHS.filter(function(x){return x.id===id;})[0];
      setTimeout(function(){var t=document.createElement('div');t.className='ach-toast';t.textContent='THÀNH TỰU: '+a.name+'!';area.appendChild(t);setTimeout(function(){t.remove();},2400);},idx*2500);});
      confetti();}}
  function achBadges(){var unlocked=getAch();var h='<div style="text-align:center;margin:6px 0;">';
    ACHS.forEach(function(a){var on=unlocked.indexOf(a.id)!==-1;h+='<span class="ach-badge'+(on?' ach-unlocked':'')+'" title="'+a.name+': '+a.desc+'">'+a.ic+'</span>';});
    return h+'</div><div style="font-size:10px;color:#64748b;text-align:center;">'+unlocked.length+'/'+ACHS.length+' huy chương</div>';}

  // ===== THỐNG KÊ CÁ NHÂN =====
  var STATS_KEY='voly_stats_v1';
  var stats={gamesPlayed:0,totalLevels:0,totalScore:0,bestScore:0,bestCombo:0,bestLevel:0};
  try{var _s=JSON.parse(localStorage.getItem(STATS_KEY)||'{}');for(var k in _s)stats[k]=_s[k];}catch(e){}
  function saveStats(){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats));}catch(e){}}
  function statsGrid(){return '<div class="stat-grid">'
    +'<div class="stat-box"><div class="stat-num">'+stats.gamesPlayed+'</div><div class="stat-lbl">Lần chơi</div></div>'
    +'<div class="stat-box"><div class="stat-num">'+stats.totalLevels+'</div><div class="stat-lbl">Tổng cấp</div></div>'
    +'<div class="stat-box"><div class="stat-num">'+stats.bestScore+'</div><div class="stat-lbl">Điểm cao nhất</div></div>'
    +'<div class="stat-box"><div class="stat-num">'+stats.bestCombo+'</div><div class="stat-lbl">Combo cao nhất</div></div>'
    +'<div class="stat-box"><div class="stat-num">'+(stats.bestLevel+1)+'</div><div class="stat-lbl">Cấp xa nhất</div></div>'
    +'<div class="stat-box"><div class="stat-num">'+getAch().length+'/'+ACHS.length+'</div><div class="stat-lbl">Huy chương</div></div></div>';}

  // ===== NHIỆM VỤ HÀNG NGÀY =====
  function dayKey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function todayKey(){return dayKey(new Date());}
  var Q_KEY='voly_quests_v1';
  var quests={date:todayKey(),levels:0,combo:0,score:0,done:{}};
  try{var _q=JSON.parse(localStorage.getItem(Q_KEY)||'{}');if(_q.date===todayKey()){quests=_q;if(!quests.done)quests.done={};}}catch(e){}
  function ensureToday(){if(quests.date!==todayKey()){quests={date:todayKey(),levels:0,combo:0,score:0,done:{}};}}
  function saveQuests(){try{localStorage.setItem(Q_KEY,JSON.stringify(quests));}catch(e){}}
  function toast(text){var t=document.createElement('div');t.className='ach-toast';t.style.top='44px';t.textContent=text;area.appendChild(t);setTimeout(function(){t.remove();},2400);}
  function checkQuests(){[['lv',quests.levels>=15,'Qua 15 cấp'],['cb',quests.combo>=3,'Combo ×3'],['sc',quests.score>=200,'200 điểm']].forEach(function(q){if(q[1]&&!quests.done[q[0]]){quests.done[q[0]]=1;saveQuests();var it=pk(ITM_IDS);addItem(it,1);toast('NHIỆM VỤ XONG: '+q[2]+' · +1 '+ITM[it].n);}});}
  function questRows(){var qs=[
    {n:'Qua 15 cấp hôm nay',p:Math.min(1,quests.levels/15),cur:quests.levels,tg:15},
    {n:'Đạt combo ×3',p:Math.min(1,quests.combo/3),cur:Math.min(quests.combo,3),tg:3},
    {n:'Đạt 200 điểm trong 1 lần',p:Math.min(1,quests.score/200),cur:Math.min(quests.score,200),tg:200}];
    var h='';qs.forEach(function(q){h+='<div class="quest-row"><span style="min-width:110px;">'+(q.p>=1?'✓ ':'')+q.n+'</span><div class="quest-bar"><div class="quest-fill" style="width:'+(q.p*100)+'%"></div></div><span style="min-width:36px;text-align:right;">'+q.cur+'/'+q.tg+'</span></div>';});
    return h;}

  // ===== LEADERBOARD server =====
  var LB_URL='https://kvdb.io/voly5000_global_final/board', LB_LOCAL='voly_lb_local_v2', LB_PEND='voly_lb_pending_v2';

  function syncPending(cb){cb=cb||function(){};var pend=loadPend();if(!pend.length)return cb(true);
    if(lbBusy){setTimeout(function(){syncPending(cb);},1500);return;}lbBusy=true;
    fetchBoard().then(function(srv){var merged=mergeLB(srv,pend);
      return fetch(LB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(merged)})
        .then(function(r){if(!r.ok)throw new Error('put');return fetchBoard();})
        .then(function(chk){var lost=pend.filter(function(p){return hasE(merged,p)&&!hasE(chk,p);});if(lost.length)throw new Error('race');

  function gTime(){var h=ri(1,11),m=pk([0,15,30,45]),ad=pk([20,40,50,75,90,130]),t=h*60+m+ad,f=function(H,M){return H+':'+(M<10?'0':'')+M;},H=Math.floor(t/60)%12||12,r=f(H,t%60),w={},o=[];w[r]=1;while(o.length<3){var x=f((H+ri(0,2))%12||12,pk([0,10,15,20,30,40,45,50]));if(!w[x]){w[x]=1;o.push(x);}}quizC('Bây giờ là '+f(h,m)+'. Sau '+ad+' phút là mấy giờ?',r,o,'Tính giờ chuẩn! +10');}
  function gPerim(){var a=ri(2,12),b=ri(2,12),k=ri(0,2);if(k===0)quizC('Chu vi hình chữ nhật '+a+' × '+b+' là?',2*(a+b),wn(2*(a+b),3),'Tính chu vi chuẩn! +10');else if(k===1)quizC('Diện tích hình chữ nhật '+a+' × '+b+' là?',a*b,wn(a*b,3),'Tính diện tích chuẩn! +10');else quizC('Chu vi hình vuông cạnh '+a+' là?',4*a,wn(4*a,3),'Tính chu vi chuẩn! +10');}
  function gMissOp(){var O=['+','-','×'],a,b,o,r,n;do{a=ri(2,9);b=ri(2,9);o=pk(O);r=o==='+'?a+b:o==='-'?a-b:a*b;n=(a+b===r)+(a-b===r)+(a*b===r);}while(n!==1||r<0);quiz4(a+' ? '+b+' = '+r+'  — dấu ? là gì?',['+','−','×'],O.indexOf(o),'Đoán dấu chuẩn! +10');}
  function gDigit(){var n=ri(8,14),t='',d=ri(0,9),c=0,i,x;for(i=0;i<n;i++){x=ri(0,9);t+=x+' ';if(x===d)c++;}quizC('Chữ số '+d+' xuất hiện mấy lần?   '+t,c,wn(c,3),'Đếm tinh mắt! +10');}
  function gFind(){var t,a,b;do{t=ri(21,98);a=Math.floor(t/10);b=t%10;}while(a===b||b===0);var c=[b*10+a,t+1,t-1,t+10,t-10,t+9,t-9,t+11].filter(function(x,i,A){return x>=10&&x<=99&&x!==t&&A.indexOf(x)===i;}),o=sh([t].concat(sh(c).slice(0,7))),d=hd('Tìm và nhấn số '+t,'Cẩn thận số đảo ngược'),row=br();
    o.forEach(function(x){var bt=document.createElement('button');bt.className='game-btn btn-ghost';bt.style.cssText='font-size:16px;min-width:50px;';bt.textContent=x;bt.onclick=function(){sClick();if(x===t)win('Mắt diều hâu! +10');else lose('Sai! Số cần tìm là '+t);};row.appendChild(bt);});d.appendChild(row);area.appendChild(d);}
  function gHeight(){var N=sh(['An','Bình','Chi','Dũng','Mai']).slice(0,3),t=RND()<.5,s1=RND()<.5?N[0]+' cao hơn '+N[1]:N[1]+' thấp hơn '+N[0],s2=RND()<.5?N[1]+' cao hơn '+N[2]:N[2]+' thấp hơn '+N[1],S=RND()<.5?s1+'. '+s2:s2+'. '+s1;quizC(S+'. Ai '+(t?'CAO':'THẤP')+' nhất?',t?N[0]:N[2],t?[N[1],N[2],'Không biết']:[N[0],N[1],'Không biết'],'Suy luận tốt! +10');}
  function gDir(){var D=['Bắc','Đông','Nam','Tây'],i=ri(0,3),k=pk([1,2,3]),r=RND()<.5,a=D[(i+(r?k:4-k))%4];quizC('Bạn nhìn về hướng '+D[i]+', quay '+(r?'phải':'trái')+' '+k*90+'° thì nhìn về hướng nào?',a,D.filter(function(x){return x!==a;}),'Định hướng tốt! +10');}

  // --- trang thông tin: hướng dẫn / FAQ / điều khoản / bảo mật / liên hệ
  var GUIDE=[
   ['Bắt đầu nhanh',`<p>Bấm <b>CHƠI NGAY</b>. Mỗi cấp là một thử thách khác nhau, tổng cộng ${'${TOTAL}'} cấp. Làm đúng để sang cấp tiếp theo, làm sai hoặc hết giờ sẽ mất <b>1 mạng</b>. Hết mạng là thua.</p><p>Mạng khởi đầu là 7 / 5 / 3 tùy độ khó (Dễ / Thường / Khó), tối đa 10 mạng. Cứ qua 50 cấp được tặng thêm 1 mạng.</p><p>Trên máy tính: phím <b>1-4</b> chọn đáp án, <b>Enter</b> sang cấp tiếp.</p>`],
   ['Điểm, combo và hạng',`<p>Mỗi cấp đúng được <b>+10 điểm</b>. Đúng liên tiếp tạo <b>combo</b>: cứ 5 combo được thêm +5 điểm mỗi cấp. Sai một lần là mất combo.</p><p>Mỗi 100 cấp bạn lên <b>1 hạng</b> và nhận +50 điểm. Điểm số quyết định danh hiệu cuối ván (từ "Gà con chưa lông" đến "VUA trò chơi điên đầu").</p>`],
   ['Boss mỗi 100 cấp',`<p>Cấp thứ 100, 200, 300... là <b>BOSS</b>. Boss có 3 máu: bạn cần thắng 3 thử thách. Không thể bỏ qua boss. Hạ boss được +100 điểm và +1 mạng.</p>`],
   ['Các chế độ chơi',`<ul><li><b>Chơi thường</b>: tính điểm, được lên bảng xếp hạng.</li><li><b>Luyện tập</b>: chọn nhóm dạng trò muốn rèn, không mất mạng, không tính điểm, sai thì thử lại.</li><li><b>Chạy nước rút 60 giây</b>: làm càng nhiều càng tốt, sai hoặc bỏ qua bị trừ 5 giây.</li><li><b>Thách đấu</b>: mọi người chơi cùng một bộ đề để so điểm công bằng, kể cả thử thách hôm nay.</li><li><b>Bộ câu hỏi riêng</b>: tự soạn câu hỏi theo dạng <i>Câu hỏi | Đáp án đúng | Sai 1 | Sai 2 | Sai 3</i> rồi luyện hoặc chơi thật.</li></ul>`],
   ['Nhóm Toán và số',`<p>Tính nhẩm (cộng, trừ, nhân, chia, bảng cửu chương, bình phương, căn), tìm quy luật dãy số, tính giờ, chu vi / diện tích, đoán dấu phép tính, đếm chữ số, so sánh, làm tròn. Mẹo: ước lượng trước khi tính, loại ngay đáp án quá lớn hoặc quá nhỏ.</p>`],
   ['Nhóm Kiến thức và đố mẹo',`<p>Hơn 200 câu đố mẹo, địa lý, lịch sử, khoa học, văn hóa, động vật, cơ thể, vũ trụ, đời sống. Câu "đố mẹo" thường có bẫy: đọc kỹ từng chữ, đừng trả lời theo phản xạ.</p>`],
   ['Nhóm Trí nhớ',`<p>Nhớ số, nhớ ô sáng, lật cặp, nhớ mật khẩu. Con số hay ô sáng chỉ hiện vài giây rồi biến mất, hãy nhẩm đọc thầm hoặc chia nhóm 2-3 chữ số để dễ nhớ.</p>`],
   ['Nhóm Phản xạ',`<p>Nhấn đúng lúc, nhấn nhanh, bắt nút đang né, đập chuột, giữ nút, nhấn các ô theo yêu cầu (số chẵn, bội số, nguyên tố, nguyên âm, đúng loại từ). Ở dạng "đừng nhấn gì cả" hoặc nút bẫy, kiên nhẫn mới là cách thắng. Nhấn nhầm một ô là mất mạng.</p>`],
   ['Nhóm Chữ và logic',`<p>Gõ chữ, xếp thứ tự bảng chữ cái, tìm từ khác loại, phân loại, suy luận (ai cao nhất), định hướng, màu chữ lừa mắt (Stroop). Mẹo Stroop: nhìn màu mực, bỏ qua nghĩa của chữ.</p>`],
   ['Vật phẩm, xu và chuỗi ngày',`<ul><li><b>Khiên</b>: đỡ một lần sai, không mất mạng.</li><li><b>50/50</b>: loại bớt hai đáp án sai.</li><li><b>+4 giây</b>: thêm thời gian cho thử thách có đồng hồ.</li><li><b>Xu</b>: cuối mỗi ván cứ 10 điểm được 1 xu, dùng mua vật phẩm trong Cửa hàng.</li><li><b>Chuỗi ngày</b>: chơi liên tiếp mỗi ngày để nhận vật phẩm, đủ 7 ngày có thưởng tuần.</li></ul>`],
   ['Huy chương và nhiệm vụ',`<p>Có rất nhiều huy chương: theo cấp, điểm, combo, số ván, boss, chuỗi ngày và xu. Huy chương tự mở khi đạt điều kiện, rê chuột hoặc chạm giữ vào huy chương để xem mô tả. Mỗi ngày có 3 nhiệm vụ nhỏ (qua 15 cấp, combo ×3, 200 điểm), hoàn thành được tặng vật phẩm.</p>`],
   ['Bảng xếp hạng',`<p>Sau khi thua, nhập tên và bấm <b>Lưu lên server</b> để vào Top 20 toàn cầu. Nếu mất mạng, điểm được lưu tạm trên máy và tự đồng bộ lại khi có mạng. Chế độ luyện tập và thách đấu có luật riêng nên có thể không lên bảng.</p>`],
   ['Mẹo để đi xa',`<ul><li>Bấm <b>Tạm dừng</b> khi cần nghỉ, nhưng tiếp tục sẽ đổi đề và mất combo đang dở.</li><li>Giữ lại <b>Khiên</b> cho các cấp boss.</li><li>Dùng chế độ <b>Luyện tập</b> để rèn nhóm dạng trò hay sai (cuối ván có mục ôn lại câu sai).</li><li>Bật chế độ tối hoặc giảm hiệu ứng trong <b>Cài đặt</b> nếu bạn thấy mỏi mắt.</li></ul>`]
  ];
  var FAQ=[['Dữ liệu của tôi lưu ở đâu?','Tiến độ, huy chương, thống kê, xu và cài đặt lưu ngay trên trình duyệt của bạn (localStorage). Xóa dữ liệu trình duyệt hoặc đổi máy sẽ mất các dữ liệu này.'],['Vì sao điểm của tôi chưa lên bảng xếp hạng?','Có thể do mất kết nối hoặc server đang bận. Điểm được giữ lại trên máy và tự đồng bộ ở lần mở trang sau. Điểm bất thường (vượt mức tối đa có thể đạt) sẽ bị loại.'],['Tại sao tiếp tục sau khi tạm dừng lại đổi đề?','Để tránh việc dừng lại tra cứu đáp án. Bạn sẽ làm lại cấp hiện tại bằng đề mới và mất combo nếu đang làm dở.'],['Bỏ qua cấp có tốn gì không?','Bỏ qua tốn 1 mạng, không được điểm và không dùng được ở cấp boss hoặc khi chỉ còn 1 mạng.'],['Game có miễn phí không?','Hoàn toàn miễn phí, không cần đăng ký tài khoản.'],['Tôi chơi được trên điện thoại, máy tính bảng, máy tính không?','Được. Giao diện tự co giãn theo mọi kích thước màn hình, hỗ trợ cảm ứng và bàn phím.'],['Sao không nghe thấy âm thanh?','Kiểm tra nút Âm thanh trên thanh điều khiển, mục Cài đặt, và chế độ im lặng của thiết bị. Một số trình duyệt chỉ bật âm sau lần chạm đầu tiên.'],['Tôi thấy câu hỏi sai hoặc có lỗi, báo ở đâu?','Vào tab Liên hệ, mô tả câu hỏi hoặc lỗi bạn gặp. Càng chi tiết (cấp, dạng trò, thiết bị) càng dễ sửa.'],['Làm sao đặt lại toàn bộ dữ liệu?','Xóa dữ liệu trang web trong cài đặt trình duyệt (cookie và dữ liệu trang). Thao tác này không thể hoàn tác.']];
  var TERMS=`<h3>Điều khoản sử dụng</h3><p>Bằng việc sử dụng trang, bạn đồng ý với các điều khoản dưới đây.</p><ul><li><b>Mục đích:</b> trang cung cấp trò chơi giải trí miễn phí, không mang tính chất cờ bạc, không có giải thưởng bằng tiền.</li><li><b>Sử dụng hợp lý:</b> không dùng công cụ tự động, không can thiệp mã nguồn hoặc dữ liệu để gian lận bảng xếp hạng. Điểm bất thường có thể bị xóa.</li><li><b>Tên hiển thị:</b> không dùng tên chứa nội dung xúc phạm, quảng cáo, lừa đảo hoặc vi phạm pháp luật. Quản trị viên có quyền xóa mục vi phạm.</li><li><b>Nội dung:</b> câu hỏi và giao diện thuộc quyền của chủ trang. Không sao chép để bán lại khi chưa được đồng ý. Bộ câu hỏi riêng do bạn tự soạn chỉ lưu trên máy bạn và bạn chịu trách nhiệm về nội dung đó.</li><li><b>Không bảo đảm:</b> trang được cung cấp "như hiện có", có thể thay đổi, gián đoạn hoặc có sai sót mà không báo trước. Chủ trang không chịu trách nhiệm cho thiệt hại phát sinh từ việc sử dụng.</li><li><b>Thay đổi:</b> điều khoản có thể được cập nhật; việc tiếp tục sử dụng đồng nghĩa với chấp nhận bản mới.</li></ul>`;
  var PRIV=`<h3>Chính sách bảo mật</h3><p>Chúng tôi tôn trọng quyền riêng tư của bạn và chỉ xử lý lượng dữ liệu tối thiểu để trò chơi hoạt động.</p><ul><li><b>Không cần tài khoản.</b> Chúng tôi không yêu cầu email, số điện thoại hay thông tin định danh để chơi.</li><li><b>Dữ liệu trên máy bạn:</b> tiến độ, huy chương, thống kê, xu, cài đặt, tên hiển thị và bộ câu hỏi riêng được lưu trong trình duyệt của bạn, không gửi đi đâu.</li><li><b>Bảng xếp hạng:</b> khi bạn bấm "Lưu lên server", tên bạn nhập, điểm, cấp và thời gian được gửi tới dịch vụ lưu trữ bên thứ ba và hiển thị công khai. Đừng dùng tên thật hoặc thông tin cá nhân nếu bạn không muốn công khai.</li><li><b>Dịch vụ bên thứ ba:</b> trang tải phông chữ từ Google Fonts nên địa chỉ IP của bạn có thể được máy chủ Google ghi nhận theo chính sách của họ. Các nút chia sẻ (WhatsApp, X, Telegram, Facebook) chỉ mở khi bạn chủ động bấm.</li><li><b>Liên hệ:</b> nếu bạn gửi phản hồi, chúng tôi chỉ dùng nội dung đó để trả lời và cải thiện trò chơi.</li><li><b>Quyền của bạn:</b> bạn có thể xóa dữ liệu trên máy bất cứ lúc nào bằng cách xóa dữ liệu trang trong trình duyệt. Muốn gỡ tên khỏi bảng xếp hạng, hãy liên hệ chúng tôi.</li><li><b>Trẻ em:</b> trẻ dưới 13 tuổi nên chơi với sự hướng dẫn của phụ huynh và không nên nhập thông tin cá nhân.</li><li><b>Thay đổi:</b> nếu trang bổ sung quảng cáo hoặc công cụ thống kê, chính sách này sẽ được cập nhật tương ứng.</li></ul>`;
  var INFO={guide:function(){return '<h3>Hướng dẫn chơi</h3><p>Đọc lần lượt từng phần, bấm vào tiêu đề để mở.</p>'+GUIDE.map(function(p,i){return '<details'+(i?'':' open')+'><summary>Phần '+(i+1)+'/'+GUIDE.length+' · '+p[0]+'</summary>'+p[1].replace('${TOTAL}',TOTAL)+'</details>';}).join('');},
